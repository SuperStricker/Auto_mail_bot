name: On-Demand Job Auto-Mailer (Event-Triggered Only)

on:
  # Triggered ONLY when a Telegram message arrives via Webhook / Bridge
  # ZERO continuous polling. ZERO unnecessary runs. 100% Event-Driven.
  repository_dispatch:
    types: [telegram_job]

  # Manual on-demand trigger via GitHub UI / CLI if ever needed
  workflow_dispatch:
    inputs:
      job_text_or_url:
        description: 'Paste LinkedIn Job URL or copied text'
        required: false
        type: string

concurrency:
  group: auto-mail-bot-cloud
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply-and-exit:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # Maximum safety guard, normally finishes in 25-40 seconds!

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System OCR & Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytesseract

      - name: Install Playwright Browsers (for web post parsing)
        run: |
          python -m playwright install --with-deps chromium

      - name: Process Application & Send Email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.job_text_or_url }}" ]; then
            python on_demand_worker.py --text "${{ github.event.inputs.job_text_or_url }}"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            python on_demand_worker.py --payload '${{ toJson(github.event.client_payload) }}'
          else
            python on_demand_worker.py --poll
          fi
